<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="100%" height="100%" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161e2e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentBronze" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="accentSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentFeast" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="flowArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- ==================== HEADER SECTION ==================== -->
  <g transform="translate(40, 28)">
    <text x="0" y="22" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.5">Home Credit Senior Data Engineering Lakehouse</text>
    <text x="0" y="44" fill="#94a3b8" font-size="13">End-to-End Medallion Pipeline • dbt Core • Quality Circuit Breaker • Feast Feature Store</text>
    
    <!-- Top Right Meta Badges -->
    <g transform="translate(850, 0)">
      <rect x="0" y="2" width="170" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="20" r="4" fill="#10b981" />
      <text x="28" y="24" fill="#e2e8f0" font-size="11" font-weight="600">CI/CD Pipeline: Verified</text>
      
      <rect x="180" y="2" width="170" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="196" cy="20" r="4" fill="#38bdf8" />
      <text x="208" y="24" fill="#e2e8f0" font-size="11" font-weight="600">Zero Leakage Serving</text>
    </g>
  </g>

  <!-- Flow Connector Lines Behind Cards -->
  <line x1="260" y1="310" x2="285" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#flowArrow)" />
  <line x1="505" y1="310" x2="530" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#flowArrow)" />
  <line x1="750" y1="310" x2="775" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#flowArrow)" />
  <line x1="995" y1="310" x2="1020" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#flowArrow)" />

  <!-- ==================== STAGE 1: RAW SOURCES ==================== -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="220" height="430" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1" filter="url(#dropShadow)" />
    <rect x="0" y="0" width="220" height="6" rx="3" fill="#64748b" />
    <text x="16" y="32" fill="#cbd5e1" font-size="11" font-weight="700" letter-spacing="1">RAW SOURCES</text>
    <text x="16" y="52" fill="#f8fafc" font-size="15" font-weight="700">7 Relational CSVs</text>
    <text x="16" y="70" fill="#64748b" font-size="11">58.5M Total Historical Records</text>

    <!-- Source Items -->
    <g transform="translate(12, 85)">
      <rect x="0" y="0" width="196" height="44" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="20" fill="#f1f5f9" font-size="12" font-weight="600">application_train/test</text>
      <text x="10" y="36" fill="#94a3b8" font-size="11">356k rows (Target &amp; Demographics)</text>
    </g>

    <g transform="translate(12, 137)">
      <rect x="0" y="0" width="196" height="44" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="20" fill="#f1f5f9" font-size="12" font-weight="600">bureau &amp; bureau_balance</text>
      <text x="10" y="36" fill="#94a3b8" font-size="11">28.9M records (Credit History)</text>
    </g>

    <g transform="translate(12, 189)">
      <rect x="0" y="0" width="196" height="44" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="20" fill="#f1f5f9" font-size="12" font-weight="600">previous_application</text>
      <text x="10" y="36" fill="#94a3b8" font-size="11">1.67M past loan proposals</text>
    </g>

    <g transform="translate(12, 241)">
      <rect x="0" y="0" width="196" height="44" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="20" fill="#f1f5f9" font-size="12" font-weight="600">installments_payments</text>
      <text x="10" y="36" fill="#94a3b8" font-size="11">13.6M repayment records</text>
    </g>

    <g transform="translate(12, 293)">
      <rect x="0" y="0" width="196" height="44" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="20" fill="#f1f5f9" font-size="12" font-weight="600">POS_CASH &amp; credit_card</text>
      <text x="10" y="36" fill="#94a3b8" font-size="11">13.8M monthly loan balances</text>
    </g>

    <!-- Ingestion Footer Badge -->
    <g transform="translate(12, 350)">
      <rect x="0" y="0" width="196" height="62" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="10" y="20" fill="#38bdf8" font-size="11" font-weight="700">Ingestion Protocol</text>
      <text x="10" y="36" fill="#94a3b8" font-size="10.5">• 4MB chunked streaming</text>
      <text x="10" y="51" fill="#94a3b8" font-size="10.5">• Azure Blob / Azurite landing</text>
    </g>
  </g>

  <!-- ==================== STAGE 2: BRONZE LAYER ==================== -->
  <g transform="translate(285, 95)">
    <rect x="0" y="0" width="220" height="430" rx="10" fill="url(#cardBg)" stroke="#d97706" stroke-width="1" filter="url(#dropShadow)" />
    <rect x="0" y="0" width="220" height="6" rx="3" fill="url(#accentBronze)" />
