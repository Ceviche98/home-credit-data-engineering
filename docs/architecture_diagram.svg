      <text x="10" y="20" fill="#6ee7b7" font-size="11.5" font-weight="700">Risk Engineered Mart</text>
      <text x="10" y="38" fill="#cbd5e1" font-size="11">• 307,511 rows × 152 cols</text>
      <text x="10" y="56" fill="#cbd5e1" font-size="11">• Solvency &amp; debt-to-annuity</text>
      <text x="10" y="74" fill="#cbd5e1" font-size="11">• Bureau default rates</text>
      <text x="10" y="92" fill="#cbd5e1" font-size="11">• Late fees &amp; DPD metrics</text>
      <text x="10" y="110" fill="#cbd5e1" font-size="11">• Revolving card limits</text>
    </g>

    <g transform="translate(12, 220)">
      <rect x="0" y="0" width="196" height="95" rx="6" fill="#1e293b" stroke="#065f46" stroke-width="0.8" />
      <text x="10" y="20" fill="#6ee7b7" font-size="11.5" font-weight="700">Modular dbt DAG</text>
      <text x="10" y="38" fill="#cbd5e1" font-size="11">• 7 Staging views (casting)</text>
      <text x="10" y="56" fill="#cbd5e1" font-size="11">• 5 Intermediate aggregates</text>
      <text x="10" y="74" fill="#cbd5e1" font-size="11">• 1 Master gold table</text>
    </g>

    <g transform="translate(12, 323)">
      <rect x="0" y="0" width="196" height="89" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="1.2" />
      <text x="10" y="22" fill="#f87171" font-size="12" font-weight="700">Circuit Breaker Gate</text>
      <text x="10" y="42" fill="#fecaca" font-size="11">• 15 Automated Tests</text>
      <text x="10" y="60" fill="#fecaca" font-size="11">• PK Uniqueness &amp; Bounds</text>
      <text x="10" y="78" fill="#fca5a5" font-size="10.5" font-weight="600">Blocks sync on failure</text>
    </g>
  </g>

  <!-- ==================== STAGE 5: SERVING LAYER ==================== -->
  <g transform="translate(1020, 95)">
    <rect x="0" y="0" width="220" height="430" rx="10" fill="url(#cardBg)" stroke="#8b5cf6" stroke-width="1" filter="url(#dropShadow)" />
    <rect x="0" y="0" width="220" height="6" rx="3" fill="url(#accentFeast)" />
    <text x="16" y="32" fill="#c084fc" font-size="11" font-weight="700" letter-spacing="1">SERVING LAYER</text>
