      <text x="10" y="38" fill="#cbd5e1" font-size="11">• Port 6379 in-memory cache</text>
      <text x="10" y="56" fill="#cbd5e1" font-size="11">• Sub-millisecond latency (&lt;1ms)</text>
      <text x="10" y="74" fill="#cbd5e1" font-size="11">• Single hash key per entity</text>
      <text x="10" y="92" fill="#a78bfa" font-size="10.5" font-weight="600">Live Credit Scoring API</text>
    </g>

    <!-- Downstream Consumers -->
