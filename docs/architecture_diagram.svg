      <text x="10" y="22" fill="#fde68a" font-size="12" font-weight="700">Audit Metadata</text>
      <text x="10" y="44" fill="#cbd5e1" font-size="11">• _meta_batch_id (UUID)</text>
      <text x="10" y="64" fill="#cbd5e1" font-size="11">• _meta_source_file</text>
      <text x="10" y="84" fill="#cbd5e1" font-size="11">• _meta_ingested_at (UTC)</text>
    </g>

    <g transform="translate(12, 320)">
      <rect x="0" y="0" width="196" height="92" rx="6" fill="#0f172a" stroke="#451a03" stroke-width="1" />
      <text x="10" y="22" fill="#f59e0b" font-size="11" font-weight="700">Ingestion Ledger</text>
      <text x="10" y="42" fill="#94a3b8" font-size="10.5">• SHA-256 hash tracking</text>
      <text x="10" y="58" fill="#94a3b8" font-size="10.5">• Re-run deduplication</text>
      <text x="10" y="74" fill="#94a3b8" font-size="10.5">• ACID transaction logs</text>
    </g>
