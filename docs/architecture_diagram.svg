      <text x="10" y="38" fill="#94a3b8" font-size="10.5">• Real-time loan decisioning</text>
      <text x="10" y="54" fill="#94a3b8" font-size="10.5">• Underwriting risk service</text>
      <text x="10" y="70" fill="#94a3b8" font-size="10.5">• Fraud scoring microservice</text>
    </g>
  </g>

  <!-- ==================== FOOTER / GUARANTEES BAR ==================== -->
  <g transform="translate(40, 545)">
    <rect x="0" y="0" width="1200" height="50" rx="8" fill="#161e2e" stroke="#334155" stroke-width="1" />
    <text x="20" y="30" fill="#94a3b8" font-size="11.5" font-weight="600">ENGINEERING GUARANTEES:</text>
    
    <g transform="translate(210, 14)">
      <rect x="0" y="0" width="160" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="10" y="16" fill="#38bdf8" font-size="11" font-weight="600">✓ 100% Idempotent Runs</text>
