      <text x="10" y="20" fill="#d8b4fe" font-size="11.5" font-weight="700">Offline Store (Delta)</text>
      <text x="10" y="38" fill="#cbd5e1" font-size="11">• FileSource (Parquet/Delta)</text>
      <text x="10" y="56" fill="#cbd5e1" font-size="11">• Point-in-time time travel</text>
      <text x="10" y="74" fill="#cbd5e1" font-size="11">• Zero data leakage</text>
      <text x="10" y="92" fill="#cbd5e1" font-size="11">• ML model training dataset</text>
      <text x="10" y="110" fill="#a78bfa" font-size="10.5" font-weight="600">Feeds MLOps Pipeline</text>
    </g>

    <!-- Online Store -->
