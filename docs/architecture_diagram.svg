    <text x="16" y="52" fill="#f8fafc" font-size="15" font-weight="700">Raw Delta Lake</text>
    <text x="16" y="70" fill="#94a3b8" font-size="11">Immutable Audit Landing</text>

    <g transform="translate(12, 85)">
