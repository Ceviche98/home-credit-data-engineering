      <text x="10" y="16" fill="#a78bfa" font-size="11" font-weight="600">✓ Zero Training-Serve Skew</text>
    </g>

    <g transform="translate(765, 14)">
      <rect x="0" y="0" width="180" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="10" y="16" fill="#f59e0b" font-size="11" font-weight="600">✓ Chaos Recovery Checked</text>
    </g>

    <g transform="translate(960, 14)">
      <rect x="0" y="0" width="220" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="10" y="16" fill="#f87171" font-size="11" font-weight="600">✓ Circuit Breaker Quarantine</text>
