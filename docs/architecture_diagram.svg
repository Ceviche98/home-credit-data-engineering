      <text x="10" y="22" fill="#fde68a" font-size="12" font-weight="700">Storage Principles</text>
      <text x="10" y="44" fill="#cbd5e1" font-size="11">• 100% Append-Only Delta</text>
      <text x="10" y="64" fill="#cbd5e1" font-size="11">• All columns string-cast</text>
