      <text x="10" y="38" fill="#cbd5e1" font-size="11">• 365243.0 days → NULL</text>
      <text x="10" y="56" fill="#94a3b8" font-size="10.5">(1,000-year legacy placeholder)</text>
    </g>

    <g transform="translate(12, 168)">
      <rect x="0" y="0" width="196" height="75" rx="6" fill="#1e293b" stroke="#075985" stroke-width="0.8" />
      <text x="10" y="20" fill="#38bdf8" font-size="11.5" font-weight="700">2. 27.2M Entity Join</text>
      <text x="10" y="38" fill="#cbd5e1" font-size="11">• bureau_balance ⨝ bureau</text>
      <text x="10" y="56" fill="#94a3b8" font-size="10.5">Attaches SK_ID_CURR borrower ID</text>
    </g>

    <g transform="translate(12, 251)">
      <rect x="0" y="0" width="196" height="75" rx="6" fill="#1e293b" stroke="#075985" stroke-width="0.8" />
      <text x="10" y="20" fill="#38bdf8" font-size="11.5" font-weight="700">3. Deterministic Keys</text>
      <text x="10" y="38" fill="#cbd5e1" font-size="11">• SHA-256 for split payments</text>
      <text x="10" y="56" fill="#94a3b8" font-size="10.5">Guarantees 100% MERGE safety</text>
    </g>

    <g transform="translate(12, 334)">
      <rect x="0" y="0" width="196" height="78" rx="6" fill="#0f172a" stroke="#075985" stroke-width="1" />
      <text x="10" y="20" fill="#38bdf8" font-size="11.5" font-weight="700">4. Idempotent Upserts</text>
      <text x="10" y="38" fill="#cbd5e1" font-size="11">• Delta MERGE INTO</text>
      <text x="10" y="56" fill="#cbd5e1" font-size="11">• OPTIMIZE Z-ORDER (CURR)</text>
    </g>
  </g>

